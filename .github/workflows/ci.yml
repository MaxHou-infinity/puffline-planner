name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12"]
    defaults:
      run:
        working-directory: e_pod_line_simulator
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite with coverage gate
        run: |
          python -m pytest tests -q \
            --cov=src.models --cov=src.simulation --cov=src.hr_planning \
            --cov=src.optimizer --cov=src.sensitivity --cov=src.scenario_manager \
            --cov=src.history --cov=src.reporting --cov=src.utils \
            --cov=src.glossary --cov=src.version \
            --cov-report=term --cov-fail-under=85
