name: Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-package:
    name: Build distributable zip
    runs-on: ubuntu-latest
    env:
      PACKAGE_SUFFIX: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble package
        run: |
          set -euxo pipefail
          STAGE="package/PuffLine-Planner-${PACKAGE_SUFFIX}"
          mkdir -p "${STAGE}"
          rsync -a \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.coverage' \
            --exclude '.DS_Store' \
            --exclude 'logs' \
            --exclude '*.log' \
            e_pod_line_simulator "${STAGE}/"
          cp README.md CONTRIBUTING.md LICENSE CHANGELOG.md .gitignore "${STAGE}/"
          cp -R docs examples "${STAGE}/"
          cd package
          zip -rq "../PuffLine-Planner-${PACKAGE_SUFFIX}.zip" "PuffLine-Planner-${PACKAGE_SUFFIX}"
          cd ..
          unzip -l "PuffLine-Planner-${PACKAGE_SUFFIX}.zip" | tail -1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PuffLine-Planner-${{ env.PACKAGE_SUFFIX }}
          path: PuffLine-Planner-${{ env.PACKAGE_SUFFIX }}.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE (PyInstaller)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    env:
      PACKAGE_SUFFIX: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
    defaults:
      run:
        working-directory: e_pod_line_simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "PuffLine-Planner" `
            --icon "assets/puffline-icon.ico" `
            --add-data "assets;assets" `
            --add-data "configs;configs" `
            --disable-windowed-traceback `
            run.py

      - name: Smoke test EXE startup
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PuffLine-Planner\PuffLine-Planner.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "PuffLine-Planner exited early with code $($p.ExitCode) (likely missing modules)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "EXE smoke ok"

      - name: Zip dist folder
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PuffLine-Planner/*" `
            -DestinationPath "$env:GITHUB_WORKSPACE/PuffLine-Planner-Windows-$env:PACKAGE_SUFFIX.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PuffLine-Planner-Windows-${{ env.PACKAGE_SUFFIX }}
          path: PuffLine-Planner-Windows-${{ env.PACKAGE_SUFFIX }}.zip
          if-no-files-found: error

  build-app:
    name: Build macOS App (PyInstaller)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    env:
      PACKAGE_SUFFIX: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
    defaults:
      run:
        working-directory: e_pod_line_simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm packaging/e_pod_line_simulator.spec

      - name: Zip app
        run: |
          ditto -c -k --keepParent \
            "dist/PuffLine Planner.app" \
            "${GITHUB_WORKSPACE}/PuffLine-Planner-macOS-${PACKAGE_SUFFIX}.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PuffLine-Planner-macOS-${{ env.PACKAGE_SUFFIX }}
          path: PuffLine-Planner-macOS-${{ env.PACKAGE_SUFFIX }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-package
      - build-windows
      - build-app
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PuffLine-Planner*${{ github.ref_name }}
          path: release-assets
          merge-multiple: true

      - name: Create or update Release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/*.zip --clobber
          else
            gh release create "${TAG}" release-assets/*.zip --title "${TAG} 发布" --generate-notes
          fi
